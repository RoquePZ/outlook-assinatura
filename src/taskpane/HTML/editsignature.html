<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinatura Microsoft 365</title>

  <link href="../CSS/editsignature.css"
        rel="stylesheet" type="text/css">

  <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.26.2/lib/msal-browser.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

  <script src="../../utilities.js"></script>
  <script src="../Js/taskpane_render.js"></script>
  <script src="../../runtime/Js/graphprofile.js"></script>
</head>

<body>
  <div class="container">
    <h2>Assinatura corporativa</h2>

    <p>
      Clique abaixo para carregar seus dados do Microsoft 365.
    </p>

    <button type="button" id="load_m365_button"
            class="registerbtn"
            onclick="load_m365_profile()">
      Carregar meus dados do Microsoft 365
    </button>

    <input type="text" id="display_name"
           placeholder="Nome completo" required>

    <input type="email" id="email_id"
           placeholder="Email corporativo" required>

    <input type="text" id="job_title"
           placeholder="Cargo">

    <input type="text" id="department"
           placeholder="Departamento">

    <input type="text" id="phone_number"
           placeholder="Telefone">

    <input type="text" id="greeting_text"
           placeholder="Saudação (ex.: Atenciosamente,)">

    <input type="text" id="preferred_pronoun"
           placeholder="Pronome (opcional)">

    <button type="button" id="next_button_t1"
            class="registerbtn"
            onclick="create_user_info()">
      Salvar assinatura
    </button>

    <button type="button" id="reset_all_config_btn"
            class="registerbtn"
            onclick="reset_all_configuration()">
      Limpar configuração
    </button>

    <p id="message" role="status"></p>
  </div>

  <script>
    async function load_m365_profile() {
      const button = document.getElementById("load_m365_button");
      const message = document.getElementById("message");

      button.disabled = true;
      message.textContent = "Conectando ao Microsoft 365...";

      try {
        const perfil = await carregarPerfilGraph();

        document.getElementById("display_name").value =
          perfil.name || "";

        document.getElementById("email_id").value =
          perfil.email || "";

        document.getElementById("job_title").value =
          perfil.job || "";

        document.getElementById("department").value =
          perfil.department || "";

        message.textContent =
          "Dados carregados. Confira e clique em Salvar assinatura.";
      } catch (error) {
        console.error(error);
        message.textContent =
          "Não foi possível carregar os dados. Confira a autenticação e as permissões do aplicativo.";
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
