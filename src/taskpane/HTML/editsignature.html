<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assinatura Microsoft 365</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.26.2/lib/msal-browser.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

  <script src="../Js/taskpane_render.js"></script>
  <script src="../../runtime/Js/graphprofile.js"></script>
</head>

<body>
  <div class="container">
    <h2>Assinatura corporativa</h2>

    <p>
      Clique abaixo para carregar seus dados do Microsoft 365.
    </p>

    <button type="button" id="load_m365_button"
            class="registerbtn"
            onclick="load_m365_profile()">
      Carregar meus dados do Microsoft 365
    </button>

    <input type="text" id="display_name"
           placeholder="Nome completo" required>

    <input type="email" id="email_id"
           placeholder="Email corporativo" required>

    <input type="text" id="job_title"
           placeholder="Cargo">

    <input type="text" id="department"
           placeholder="Departamento">

    <input type="text" id="phone_number"
           placeholder="Telefone">

    <input type="text" id="greeting_text"
           placeholder="Saudação (ex.: Atenciosamente,)">

    <input type="text" id="preferred_pronoun"
           placeholder="Pronome (opcional)">

    <button type="button" id="next_button_t1"
            class="registerbtn"
            onclick="create_user_info()">
      Salvar assinatura
    </button>
    
    <button type="button" id="insert_signature_button"
        class="registerbtn"
        onclick="insert_signature_into_email()">
      Inserir assinatura no e-mail
    </button>    

    <button type="button" id="reset_all_config_btn"
            class="registerbtn"
            onclick="reset_all_configuration()">
      Limpar configuração
    </button>

    <p id="message" role="status"></p>
  </div>

  <script>
    async function load_m365_profile() {
      const button = document.getElementById("load_m365_button");
      const message = document.getElementById("message");

      button.disabled = true;
      message.textContent = "Conectando ao Microsoft 365...";

      try {
        const perfil = await carregarPerfilGraph();

        document.getElementById("display_name").value =
          perfil.name || "";

        document.getElementById("email_id").value =
          perfil.email || "";

        document.getElementById("job_title").value =
          perfil.job || "";

        document.getElementById("department").value =
          perfil.department || "";

        message.textContent =
          "Dados carregados. Confira e clique em Salvar assinatura.";
      } catch (error) {
        console.error(error);
        message.textContent =
          "Não foi possível carregar os dados. Confira a autenticação e as permissões do aplicativo.";
      } finally {
        button.disabled = false;
      }
    }
  </script>

<script>
function insert_signature_into_email() {
    const mensagem = document.getElementById("message");

    try {
        const mailbox = Office.context.mailbox;
        const item = mailbox && mailbox.item;

        if (!item || !item.body) {
            mensagem.textContent =
                "Abra uma nova mensagem de e-mail e tente novamente.";
            return;
        }

        const perfil =
            Office.context.roamingSettings.get("user_info");

        if (!perfil || !perfil.name || !perfil.email) {
            mensagem.textContent =
                "Salve primeiro os dados da assinatura.";
            return;
        }

        const escape = valor => String(valor || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

        const linhas = [];

        linhas.push("<strong>" + escape(perfil.name) + "</strong>");

        if (perfil.job) {
            linhas.push(escape(perfil.job));
        }

        if (perfil.department) {
            linhas.push(escape(perfil.department));
        }

        if (perfil.phone) {
            linhas.push("Telefone: " + escape(perfil.phone));
        }

        linhas.push(
            '<a href="mailto:' + escape(perfil.email) + '">' +
            escape(perfil.email) + "</a>"
        );

        if (perfil.greeting) {
            linhas.unshift(escape(perfil.greeting));
        }

        const assinatura =
            '<div style="font-family:Arial,sans-serif;' +
            'font-size:10pt;color:#333;">' +
            linhas.join("<br>") +
            "</div>";

        item.body.setSignatureAsync(
            assinatura,
            { coercionType: Office.CoercionType.Html },
            function (resultado) {
                if (resultado.status === Office.AsyncResultStatus.Succeeded) {
                    mensagem.textContent =
                        "Solicitação de inserção concluída.";
                } else {
                    console.error(
                        "Erro ao inserir assinatura:",
                        resultado.error
                    );
                    mensagem.textContent =
                        "Não foi possível inserir a assinatura. " +
                        (resultado.error?.message || "");
                }
            }
        );
    } catch (erro) {
        console.error("Erro ao inserir assinatura:", erro);
        mensagem.textContent =
            "Falha ao inserir assinatura: " + erro.message;
    }
}
</script>

  <script>
Office.onReady(function (info) {
    if (info.host === Office.HostType.Outlook) {
        console.log("Office.js inicializado no Outlook.");
    }
});
</script>
  
</body>
</html>
